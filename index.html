<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCJ Maze Configurator</title>
<link rel="stylesheet" href="style.css">
<script src="lib/jspdf.umd.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">RCJ Rescue Maze <span>Configuratore &amp; arbitraggio · regole 2027</span></div>
  <nav class="tabs">
    <button data-tab="editor" class="active">1 · Labirinto</button>
    <button data-tab="run">2 · Gara</button>
    <button data-tab="history">3 · Storico &amp; report</button>
  </nav>
  <div class="top-actions">
    <button data-act="exportAll" title="Salva su file tutti i labirinti e tutte le prove">Esporta dati</button>
    <label class="btn" title="Carica un file esportato in precedenza">Importa<input type="file" id="fileImport" accept=".json,application/json" hidden></label>
  </div>
</header>

<main>
  <section id="tab-editor" class="tab active">
    <aside class="panel left" id="edLeft"></aside>
    <div class="stage">
      <div class="floorbar" id="edFloors"></div>
      <div class="canvas-wrap" id="edWrap"><canvas id="edCanvas"></canvas></div>
      <div class="hint" id="edHint"></div>
    </div>
    <aside class="panel right" id="edRight"></aside>
  </section>

  <section id="tab-run" class="tab">
    <aside class="panel left" id="runLeft"></aside>
    <div class="stage">
      <div class="floorbar" id="runFloors"></div>
      <div class="canvas-wrap" id="runWrap"><canvas id="runCanvas"></canvas></div>
      <div class="hint">Clicca una casella per registrare cosa fa il robot. Tastiera: frecce = sposta il robot · L = LoP · M = misidentificazione · Spazio = avvia/pausa · Ctrl+Z = annulla</div>
    </div>
    <aside class="panel right" id="runRight"></aside>
  </section>

  <section id="tab-history" class="tab single">
    <div class="hist" id="hist"></div>
  </section>
</main>

<div id="popover" class="popover hidden"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
